# Story Dojo — bundled seed exchange rates (USD base).
#
# This file is a fallback only. The app reads it once on startup if no
# live-refreshed rates are cached yet (see localStorage key
# "storyDojo_currency_rates_cache"). Use "Refresh exchange rates" inside
# Voice Input Settings to pull current rates from a free public API
# (https://open.er-api.com) at any time — that always wins over this file.
#
# Update this file by hand occasionally so a fresh install starts with a
# reasonable seed even before the user hits Refresh.

asOf: 2025-01-01
base: USD
rates:
  USD: 1
  EUR: 0.92
  JPY: 150
  GBP: 0.79
  INR: 95.22
  CNY: 7.24
  AUD: 1.52
  CAD: 1.36
  CHF: 0.88
  SGD: 1.34
